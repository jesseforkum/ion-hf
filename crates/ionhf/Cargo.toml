[package]
name = "ionhf"
version = "0.1.0-alpha.6"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
chrono = "0.4.45"
cpal = "0.15.3"
crossbeam-channel = "0.5.17"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "glow", "default_fonts", "clipboard", "persistence", "wayland", "x11"] }
env_logger = "0.11.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ion = { path = "../ion" }
ion-dsp = { path = "../ion-dsp" }
log = "0.4.34"
rtrb = "0.4.0"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
# No libudev: only opening ports by name is needed.
serialport = { version = "4", default-features = false }
tci = { path = "../tci" }
toml = "1.1.8"

[build-dependencies]
winresource = "0.1.34"

[package.metadata.deb]
name = "ionhf"
maintainer = "Jesse Forkum <67489731+jesseforkum@users.noreply.github.com>"
copyright = "Jesse Forkum"
license-file = ["../../LICENSE", "0"]
extended-description = """An adaptive HF data modem for amateur radio: an ARQ link from MFSK to 64QAM OFDM and broadcast groups, behind a VARA-style host interface for Winlink clients such as Pat and group chat such as Ragtime."""
section = "hamradio"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/ionhf", "usr/bin/", "755"],
    ["../../packaging/linux/ionhf.desktop", "usr/share/applications/", "644"],
    ["assets/icon.png", "usr/share/icons/hicolor/256x256/apps/ionhf.png", "644"],
    ["../../packaging/README.txt", "usr/share/doc/ionhf/", "644"],
    ["../../NOTICE", "usr/share/doc/ionhf/", "644"],
]
